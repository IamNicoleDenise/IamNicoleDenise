<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Nicole Coleman, AI Automation Engineer and Founder of 3509 Innovations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1446"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .line{opacity:0;animation:cycle 12s infinite}
    .l2{animation-delay:4s}
    .l3{animation-delay:8s}
    @keyframes cycle{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .node{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:1s}
    .n3{animation-delay:2s}
    @keyframes pulse{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
  </style>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect width="900" height="240" rx="16" fill="url(#grid)"/>

  <text x="48" y="60" class="mono" font-size="15" fill="#67E8F9">~/3509 $ whoami<tspan class="cursor"> ▍</tspan></text>
  <text x="46" y="120" class="sans" font-size="54" font-weight="800" fill="url(#accent)">Nicole Coleman</text>
  <text x="48" y="154" class="sans" font-size="20" font-weight="600" fill="#E5E7EB">AI Automation Engineer · Founder, 3509 Innovations</text>

  <g class="mono" font-size="15" fill="#C4B5FD">
    <text x="48" y="198" class="line">&gt; Power Platform · Copilot Studio · Claude API</text>
    <text x="48" y="198" class="line l2">&gt; intake → routing → approvals → AI agents</text>
    <text x="48" y="198" class="line l3">&gt; I build systems. AI, cloud, and data are the force behind them.</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="2">
    <path class="flow" d="M742 70 L812 120"/>
    <path class="flow" d="M812 120 L742 170"/>
    <path class="flow" d="M742 70 L742 170" stroke-opacity="0.35"/>
  </g>
  <g fill="#0B1020" stroke-width="2">
    <circle class="node" cx="742" cy="70" r="24" stroke="#67E8F9"/>
    <circle class="node n2" cx="812" cy="120" r="24" stroke="#A78BFA"/>
    <circle class="node n3" cx="742" cy="170" r="24" stroke="#F472B6"/>
  </g>
  <g class="mono" font-size="11" fill="#E5E7EB" text-anchor="middle">
    <text x="742" y="74">intake</text>
    <text x="812" y="124">AI</text>
    <text x="742" y="174">action</text>
  </g>
</svg>
